<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teaser — The Last Night of the Fiesta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=VT323&family=IM+Fell+English+SC&family=Special+Elite&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=23">
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
  </script>
  <style>
    /* Ang laro ay nasa likod (1280x720), ang teaser canvas ang nakikita */
    html, body { background: #000; overflow: hidden; }
    #game { position: fixed; left: 0; top: 0; width: 1280px !important; height: 720px !important; max-width: none; margin: 0; }
    #game > *:not(#world) { display: none !important; }
    #game::after { display: none; }
    #world canvas { filter: none !important; }
    #teaser {
      position: fixed; inset: 0; margin: auto; z-index: 100; background: #000;
      width: min(100vw, 177.78vh); height: min(56.25vw, 100vh);
    }
    #panel {
      position: fixed; z-index: 200; left: 50%; top: 50%; transform: translate(-50%, -50%);
      background: rgba(12, 6, 14, 0.94); border: 2px solid #8a1c1c; color: #eee; padding: 22px 26px; width: min(560px, 92vw);
      font-family: 'Special Elite', monospace; text-align: center;
    }
    #panel h1 { font-family: 'IM Fell English SC', serif; color: #d33; font-size: 34px; margin: 0 0 6px; letter-spacing: 2px; }
    #panel p { color: #bbb; font-size: 15px; line-height: 1.4; }
    #panel button { font-family: inherit; font-size: 18px; margin: 6px; padding: 10px 18px; background: #1a0808; color: #fff; border: 2px solid #8a1c1c; cursor: pointer; }
    #panel button:hover { background: #8a1c1c; }
    #status { margin-top: 10px; color: #e0b25c; min-height: 20px; }
    body.playing #panel { display: none; }
    body.playing { cursor: none; }
  </style>
</head>
<body class="trailer">
  <canvas id="teaser" width="1280" height="720"></canvas>
  <div id="panel">
    <h1>Teaser Recorder</h1>
    <p>A 1-minute teaser made from the real game.<br>Keep this tab visible while it plays. Turn your volume up.</p>
    <button id="btnPreview">▶ Preview</button>
    <button id="btnRecord">⏺ Record video</button>
    <div id="status">Loading the barrio...</div>
  </div>

  <!-- Ang parehong laro (nakatago sa likod) -->
  <div id="game" class="on-title">
    <div id="world"></div>
    <div id="bg"></div>
    <div id="chars"></div>
    <div id="stage-click"></div>
    <div id="hud"><div id="stats"></div><div id="menu"><button data-act="menu" class="menu-btn">☰ Menu</button></div></div>
    <div id="objective"><span id="objective-arrow">▲</span><span class="obj-label" data-i18n="objective">OBJECTIVE</span> <span id="objective-text"></span> <span id="objective-dist"></span></div>
    <div id="prompt"></div>
    <div id="crosshair"></div>
    <div id="lookhint" data-i18n="clickToLook"></div>
    <div id="questTracker"></div>
    <canvas id="minimap" width="440" height="440"></canvas>
    <div id="redvignette"></div>
    <div id="bloodscreen"></div>
    <div id="survival">
      <div class="sv-clock">🔔 <span id="sv-time">11:00 PM</span></div>
      <div class="sv-row"><span>🏃</span><div class="sv-bar"><i id="sv-stamina"></i></div></div>
      <div class="sv-row" id="sv-danger-row"><span id="sv-oil">🫙</span><div class="sv-bar danger"><i id="sv-danger"></i></div></div>
      <div class="sv-row"><span id="sv-whip" class="sv-whip"></span><span id="sv-prot"></span></div>
    </div>
    <div id="bigmap" hidden><div class="bigmap-card"><div id="bigmap-title" class="title-logo small"></div><canvas width="1600" height="1250"></canvas><div id="bigmap-hint" class="muted"></div></div></div>
    <div id="bark"></div>
    <div id="controls-help" data-i18n="controls"></div>
    <div id="joystick"><div class="knob"></div></div>
    <button id="act-btn">E</button>
    <button id="whip-btn">🪢</button>
    <div id="box"><div id="portrait"></div><div id="nametag"></div><div id="text"></div><div id="next">▼</div></div>
    <div id="choices"></div>
    <div id="toasts"></div>
    <div id="grain"></div>
    <div id="scare"></div>
    <div id="fade"></div>
    <div id="overlay" class="overlay" hidden></div>
  </div>

  <script src="js/i18n.js?v=23"></script>
  <script src="js/art.js?v=23"></script>
  <script src="js/story.js?v=23"></script>
  <script src="js/audio.js?v=23"></script>
  <script src="js/engine.js?v=23"></script>
  <script type="module" src="js/world.js?v=23"></script>
  <script type="module" src="js/trailer.js?v=23"></script>
</body>
</html>
