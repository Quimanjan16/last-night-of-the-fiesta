<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The Last Night of the Fiesta (2D)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=12">
</head>
<body>
  <!-- Lightweight 2D version (no 3D) — for low-end devices -->
  <div id="game" class="on-title">
    <div id="bg"></div>
    <div id="chars"></div>
    <div id="stage-click"></div>

    <div id="hud">
      <div id="stats"></div>
      <div id="menu">
        <button data-act="menu" class="menu-btn" title="Menu (Tab)">☰ Menu</button>
      </div>
    </div>

    <div id="box" tabindex="0" aria-live="polite">
      <div id="portrait"></div>
      <div id="nametag"></div>
      <div id="text"></div>
      <div id="next">▼</div>
    </div>

    <div id="choices"></div>
    <div id="toasts"></div>
    <div id="grain"></div>
    <div id="scare"></div>
    <div id="overlay" class="overlay" hidden></div>
  </div>

  <script src="js/i18n.js?v=12"></script>
  <script src="js/art.js?v=12"></script>
  <script src="js/story.js?v=12"></script>
  <script src="js/audio.js?v=12"></script>
  <script src="js/engine.js?v=12"></script>
</body>
</html>
